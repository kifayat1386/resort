/* ===== Utility functions ===== */

function esc(value) {
    return String(value ?? "").replace(/[&<>"']/g, ch => ({
        "&":"&amp;", "<":"&lt;", ">":"&gt;",
        '"':"&quot;", "'":"&#39;"
    })[ch]);}

function asset(path) {
    return STATIC_BASE + path.split("/").map(encodeURIComponent).join("/");}

/* ===== Create bilingual menu ===== */

function renderMenu() {
    document.getElementById("menuList").innerHTML =
        menuData.map((m, i) => `
        <button class="menu-item ${i === current ? "active" : ""}"
                style="--item-color:${m[3]}"
                onclick="goToSlide(${i})">
            <span class="menu-no">${String(i+1).padStart(2,"0")}</span>
            <span class="menu-icon">${m[2]}</span>
            <span class="menu-label">
                <span class="menu-bn">${esc(m[0])}</span>
                <span class="menu-en">${esc(m[1])}</span>
            </span>
            <span class="menu-arrow">›</span>
        </button>`).join("");}

/* ===== Slide renderers ===== */
function renderStats(stats) {
    if (!stats) return "";
    return `<div class="stats">${stats.map(s => `
        <div class="stat">
            <strong>${esc(s[0])}</strong>
            <span>${esc(s[1])}</span>
        </div>`).join("")}</div>`;}

function renderCards(cards) {
    if (!cards) return "";
    return `<div class="content-grid">${cards.map(c => `
        <div class="feature-card">
            <div class="feature-icon">${esc(c[0])}</div>
            <h3>${esc(c[1])}</h3>
            <p>${esc(c[2])}</p>
        </div>`).join("")}</div>`;}

function renderBullets(items) {
    if (!items) return "";
    return `<ul class="bullet-list">${items.map(x =>
        `<li>${esc(x)}</li>`).join("")}</ul>`;}

function renderImages(images) {
    if (!images || !images.length) return "";
    return `
        <div class="media-heading">
            <h3>📷 ছবি / Project Images</h3>
            <small>ছবিতে ক্লিক করলে বড় হবে</small>
        </div>
        <div class="media-grid">
            ${images.map((img, i) => `
                <div class="media-card">
                    <button class="media-open"
                            onclick="openImage('${esc(img[0])}','${esc(img[1])}')">
                        <img src="${asset(img[0])}"
                             alt="${esc(img[1])}"
                             loading="lazy"
                             onerror="this.style.display='none';
                             this.parentElement.style.minHeight='140px';
                             this.parentElement.style.background='#14271d'">
                        <span class="zoom-label">⌕ Zoom</span>
                    </button>
                    <div class="media-caption">${esc(img[1])}</div>
                </div>`).join("")}
        </div>`; }

}



function renderContent(s) {
    return `
    <div class="content-slide">
        <div class="content-kicker">
            PROJECT PROFILE DOSSIER · ${String(current+1).padStart(2,"0")}
        </div>
        <h1 class="content-title">${esc(s.title)}</h1>
        <div class="content-title-en">${esc(s.en || menuData[current][1])}</div>
        <div class="gold-line"></div>
        <div class="content-lead">${esc(s.lead || "")}</div>
        ${renderStats(s.stats)}
        ${renderCards(s.cards)}
        ${renderBullets(s.bullets)}
        ${s.note ? `<div class="note">⚠ ${esc(s.note)}</div>` : ""}
        ${s.images ? renderImages(s.images) : ""}
        ${s.videos ? renderVideos(s.videos) : ""}
        ${s.image ? renderImages([[s.image, s.title]]) : ""}
    </div>

    <div class="slide-footer">
        <div class="manager">
            <span>Managed by:</span>
            <b>BLUE MIRROR Hill Tea Resort</b>
        </div>
        <span>শ্রীমঙ্গল, মৌলভীবাজার, বাংলাদেশ</span>
        <span class="page-number">${String(current+1).padStart(2,"0")} / 25</span>
    </div>`;}

/* ===== Main presentation controls ===== */

let current = 0;

function renderSlide() {
    const s = slides[current];
    document.getElementById("slideContainer").innerHTML =
        s.type === "cover" ? renderCover(s) : renderContent(s);
    document.getElementById("progressLabel").textContent =
        `${String(current+1).padStart(2,"0")} / ${slides.length}`;
    document.getElementById("progressBar").style.width =
        `${((current+1)/slides.length)*100}%`;
    document.getElementById("prevBtn").disabled = current === 0;
    document.getElementById("nextBtn").disabled = current === slides.length-1;
    renderMenu();}

function goToSlide(index) {
    if (index < 0 || index >= slides.length) return;
    current = index;
    renderSlide();
    if (window.innerWidth <= 700) {
        document.getElementById("sidebar").classList.remove("menu-open");}
    window.scrollTo({top:0, behavior:"smooth"});}
function changeSlide(delta) {
    goToSlide(current + delta);}

function toggleMobileMenu() {
    document.getElementById("sidebar").classList.toggle("menu-open");}

function toggleProjector() {
    document.body.classList.toggle("projector");}
async function fullScreen() {
    try {
        if (!document.fullscreenElement) {
            await document.documentElement.requestFullscreen();
        } else {
            await document.exitFullscreen();
        }

    } catch (error) {
        alert("আপনার ব্রাউজারে Full Screen অনুমতি চালু করুন।");
    }
}

function openImage(path, title) {
    const box = document.getElementById("lightbox");
    const content = document.getElementById("lightboxContent");
    content.innerHTML = "";
    const img = document.createElement("img");
    img.src = asset(path);
    img.alt = title;
    img.onclick = () => img.classList.toggle("zoomed");
    content.appendChild(img);
    document.getElementById("lightboxCaption").textContent = title;
    box.classList.add("open");
    document.body.style.overflow = "hidden";}
function openVideo(path, title) {
    const box = document.getElementById("lightbox");
    const content = document.getElementById("lightboxContent");
    content.innerHTML = "";
    const video = document.createElement("video");
    video.src = asset(path);
    video.controls = true;
    video.autoplay = true;
    video.playsInline = true;
    content.appendChild(video);
    document.getElementById("lightboxCaption").textContent = title;
    box.classList.add("open");
    document.body.style.overflow = "hidden";}

function closeLightbox() {
    const box = document.getElementById("lightbox");
    box.classList.remove("open");
    document.getElementById("lightboxContent").innerHTML = "";
    document.body.style.overflow = "";}
document.getElementById("lightbox").addEventListener("click", function(e) {
    if (e.target === this) closeLightbox();
});
document.addEventListener("keydown", function(e) {
    if (document.getElementById("lightbox").classList.contains("open")) {
        if (e.key === "Escape") closeLightbox();
        return;}
    if (e.key === "ArrowRight") changeSlide(1);
    if (e.key === "ArrowLeft") changeSlide(-1);
    if (e.key === "Escape") {
        document.getElementById("sidebar").classList.remove("menu-open");
    }
});

renderSlide();
</script>
</body>
